<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>NEWSCast - Choose Language</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>

<body>

    <div class="language-page">

        <div class="language-card">

            <p class="language-welcome">Welcome to NEWSCast</p>
            <p class="language-tagline">Stay informed. Stay ahead.</p>
            <p class="language-instruction">Please select your preferred language to continue.</p>

            <form
                method="POST"
                action="{{ url_for('set_language') }}"
            >

                <button
                    type="submit"
                    name="language"
                    value="en"
                    class="language-button"
                >
                    🇬🇧 English
                </button>

                <button
                    type="submit"
                    name="language"
                    value="hi"
                    class="language-button"
                >
                    🇮🇳 हिंदी
                </button>

            </form>

        </div>

    </div>

</body>

</html>
